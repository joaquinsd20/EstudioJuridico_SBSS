# =============================================================================
# LEXIA — Perfil de PRODUCCION
# =============================================================================
# Aqui NO hay valores por defecto: si falta una variable de entorno, la
# aplicacion no arranca. Es deliberado. Es preferible que falle al inicio, de
# forma ruidosa, a que se conecte en silencio a la base equivocada.
#
# Variables requeridas:
#   DB_URL       jdbc:mysql://servidor:3306/lexia_db?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=America/Lima
#   DB_USERNAME  usuario de aplicacion (NO root)
#   DB_PASSWORD  su contrasena
# =============================================================================
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  flyway:
    # SOLO el esquema. 'db/seed' no aparece en esta lista, asi que la semilla de
    # desarrollo es estructuralmente incapaz de ejecutarse contra produccion:
    # no depende de recordar una bandera de configuracion.
    locations: classpath:db/migration

    # La base de produccion la crea el DBA vacia y Flyway la versiona desde V1.
    # Si algun dia hay que adoptar una base preexistente, se hace con un
    # baseline explicito y documentado, nunca activando esto por descarte.
    baseline-on-migrate: false

lexia:
  jwt:
    # Sin valor por defecto: si falta, la aplicacion no arranca. Un secreto de JWT
    # filtrado permite falsificar la sesion de cualquier usuario, incluido el
    # Administrador, asi que jamas puede vivir en un archivo del repositorio.
    secreto: ${JWT_SECRETO}
  cors:
    # Dominio real del frontend. Nunca '*' con allowCredentials activo.
    origenes: ${CORS_ORIGENES}

logging:
  level:
    root: WARN
    com.sbss.lexia: INFO
