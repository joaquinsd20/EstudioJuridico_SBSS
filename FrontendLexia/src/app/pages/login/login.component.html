<div class="login-wrapper">

  <!-- Ondas decorativas arriba -->
  <div class="wave wave-top"></div>
  <div class="wave wave-top2"></div>


  <!-- Tarjeta de login -->
  <div class="login-card">

    <img
      src="/Image/Logo/Logo.jpeg"
      alt="Logo LEXIA"
      class="brand-logo"
    >

    <p class="brand-subtitle">
      Sistema Integral de Gestión Jurídica
    </p>


    <form>

      <div class="form-group">

        <label for="email">
          Correo
        </label>

        <input
          type="email"
          id="email"
          class="input-field"
          placeholder="tucorreo@lexia.com"
        >

      </div>


      <div class="form-group">

        <label for="password">
          Contraseña
        </label>

        <input
          type="password"
          id="password"
          class="input-field"
          placeholder="••••••••"
        >

      </div>


      <button
        type="button"
        class="btn-login"
        (click)="entrar()"
      >
        Iniciar sesión
      </button>

    </form>

  </div>


  <!-- Ondas decorativas abajo -->
  <div class="wave wave-bottom"></div>
  <div class="wave wave-bottom2"></div>

</div>
